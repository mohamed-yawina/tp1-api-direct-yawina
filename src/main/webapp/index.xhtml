
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <h:outputStylesheet name="css/mycsslayout.css"/>
    <h:outputScript name="js/script.js" target="head"/>
    <title>Conversation</title>
</h:head>

<h:body>
    <f:view>

        <!-- Messages d'erreur -->
        <h:messages errorStyle="color: red"
                    showDetail="true"
                    showSummary="false"
                    globalOnly="true"/>

        <h:form id="form">

            <!-- Choix du rôle système -->
            <p:outputLabel for="rolesysteme"
                           value="Rôle de l'API : "/>

            <p:selectOneMenu id="rolesysteme"
                             value="#{bb.roleSysteme}"
                             editable="true"
                             required="true"
                             requiredMessage="Vous devez indiquer le rôle de l'API"
                             disabled="#{! bb.roleSystemeChangeable}">
                <f:selectItems value="#{bb.rolesSysteme}"/>
            </p:selectOneMenu>

            <h:message for="rolesysteme"
                       errorStyle="color: red"/>

            <h:outputText value="  "/>

            <h:commandButton value="Nouveau chat"
                             action="#{bb.nouveauChat}"/>

            <!-- Question, réponse et conversation -->
            <h:panelGrid id="paneltotal"
                         columns="2"
                         columnClasses="topAligned,topAligned">

                <!-- Partie gauche -->
                <h:panelGrid id="panelgauche" columns="1">

                    <h:panelGrid id="questionetreponse" columns="1">

                        <h:panelGroup>
                            <h:outputText value="Question :"/>

                            <button type="button"
                                    onclick="copyToClipboard('question')">
                                Copier question
                            </button>

                            <button type="button"
                                    onclick="toutEffacer()">
                                Effacer question et réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="question"
                                         value="#{bb.question}"
                                         title="Question"
                                         cols="50"
                                         rows="5"/>

                        <h:commandButton value="Envoyer la question"
                                         action="#{bb.envoyer}"/>

                        <h:panelGroup>
                            <h:outputText value="Réponse :"/>

                            <button type="button"
                                    onclick="copyToClipboard('reponse')">
                                Copier réponse
                            </button>
                        </h:panelGroup>

                        <h:inputTextarea id="reponse"
                                         value="#{bb.reponse}"
                                         title="Réponse"
                                         cols="50"
                                         rows="15"/>

                    </h:panelGrid>

                </h:panelGrid>

                <!-- Partie droite : conversation -->
                <h:panelGrid id="paneldroit"
                             columns="1"
                             style="vertical-align: top;">

                    <h:panelGroup>
                        <h:outputText value="Conversation :"/>

                        <button type="button"
                                onclick="copyToClipboard('conversation')">
                            Copier conversation
                        </button>
                    </h:panelGroup>

                    <h:inputTextarea id="conversation"
                                     rows="30"
                                     cols="50"
                                     readonly="true"
                                     value="#{bb.conversation}"
                                     title="Conversation entière"/>

                </h:panelGrid>

            </h:panelGrid>

            <!-- ================================= -->
            <!-- TP1 : MODE DEBUG                  -->
            <!-- ================================= -->

            <h:panelGroup id="panelDebug" layout="block">

                <h3>Mode debug</h3>

                <h:outputText value="Afficher les échanges JSON : "/>

                <p:toggleSwitch value="#{bb.debug}">
                    <p:ajax process="@this"
                            update="panelJson"/>
                </p:toggleSwitch>

                <h:panelGroup id="panelJson" layout="block">

                    <h:panelGroup rendered="#{bb.debug}">

                        <h3>Requête JSON envoyée au LLM</h3>

                        <h:inputTextarea id="requeteJson"
                                         value="#{bb.texteRequeteJson}"
                                         cols="100"
                                         rows="10"
                                         readonly="true"/>

                        <h3>Réponse JSON reçue du LLM</h3>

                        <h:inputTextarea id="reponseJson"
                                         value="#{bb.texteReponseJson}"
                                         cols="100"
                                         rows="10"
                                         readonly="true"/>

                    </h:panelGroup>

                </h:panelGroup>

            </h:panelGroup>

            <!-- FIN MODE DEBUG -->

        </h:form>

    </f:view>
</h:body>
</html>
